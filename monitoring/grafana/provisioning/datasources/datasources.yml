apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus-uid
    type: prometheus
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: ClickHouse
    uid: clickhouse-uid
    type: grafana-clickhouse-datasource
    jsonData:
      host: clickhouse
      port: 9000
      protocol: native
      defaultDatabase: stream_processing_project
      username: default
    secureJsonData:
      password: clickhouse
    editable: false