services:
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    ports:
      - "9092:9092"        # host clients (Python scripts) connect here
      - "9101:9101"        # JMX (optional, for Prometheus scraping)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:9093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Tuning knobs in the experiments
      KAFKA_NUM_NETWORK_THREADS: 3
      KAFKA_NUM_IO_THREADS: 8
      KAFKA_LOG_RETENTION_HOURS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: kafka
    volumes:
      -  kafka-data:/var/lib/kafka/data
    deploy:
      resources:
        limits:
          cpus: "4"          # tweak this to simulate an underprovisioned broker
          memory: 2G

  console:
    image: docker.redpanda.com/redpandadata/console:latest
    container_name: kafka-console
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: kafka:29092
    depends_on:
      - kafka

  pushgateway:
    image: prom/pushgateway:latest
    container_name: pushgateway
    ports:
      - "9091:9091"
  
  jmx-exporter:
    build: ./monitoring/jmx-exporter
    container_name: jmx-exporter
    ports:
      - "5556:5556"
    depends_on:
      - kafka
    restart: on-failure
	
  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    container_name: kafka-exporter
    command: ["--kafka.server=kafka:29092"]
    ports:
      - "9308:9308"
    depends_on:
      - kafka
    restart: on-failure
	
  prometheus:
    build: ./monitoring/prometheus
    container_name: prometheus
    ports:
      - "9090:9090"
    depends_on:
      - kafka-exporter

  grafana:
    build: ./monitoring/grafana
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: clickhouse
    environment:
      # Without these, the image's entrypoint disables network access for
      # the default user entirely (only local/in-container clients work) —
      # needed since Flink and Grafana connect over the network, not locally.
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: clickhouse
    ports:
      - "8123:8123"        # HTTP interface
      - "9000:9000"        # native protocol (Flink sink, Grafana datasource)
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./monitoring/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql
  
  flink-jobmanager:
    build: ./monitoring/flink
    container_name: flink-jobmanager
    command: jobmanager
    ports:
      - "8081:8081"        # Flink web UI
      - "9249:9249"        # Prometheus reporter
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        metrics.reporters: prom
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
    volumes:
      - ./flink_jobs:/opt/flink/usrlib
      - flink-checkpoints:/opt/flink/checkpoints
    depends_on:
      - kafka
      - clickhouse
	
  flink-taskmanager:
    image: ./monitoring/flink
    container_name: flink-taskmanager
    command: taskmanager
    ports:
      - "9249"             # Prometheus reporter (scraped via container DNS, not host)
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 6
        metrics.reporters: prom
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
    volumes:
      - flink-checkpoints:/opt/flink/checkpoints
    depends_on:
      - flink-jobmanager

volumes:
  kafka-data:
  grafana-data:
  clickhouse-data:
  flink-checkpoints: